<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Détails du Don">
    <title>Détails du Don</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/font-awesome.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <!-- Header -->


    <!-- Affichage Détails du Don -->
    <body>
        <!-- Header -->
        <header>
            <div class="container">
                <div class="row">
                    <nav class="navbar navbar-default">
                        <div class="container">
                            <div class="navbar-header">
                                <a class="navbar-brand" href="index.html"><img src="assets/img/logo.png" class="logo" alt="Logo"></a>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </header>
    
        <!-- Affichage Détails du Don -->
        <div class="don-details-area default-padding">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="site-heading text-center">
                            <h4>Détails du Don</h4>
                            <h2>Voir les informations du Don</h2>
                        </div>
                    </div>
                </div>
    
                <div class="row">
                    <div class="col-lg-8 offset-lg-2">
                        <div class="don-info">
                            <!-- Affichage dynamique des détails du don -->
                            <table class="table table-bordered table-hover">
                                <tr>
                                    <th>ID du Don</th>
                                    <td id="donID">1</td>
                                </tr>
                                <tr>
                                    <th>Type de Don</th>
                                    <td id="donType">Argent</td>
                                </tr>
                                <tr>
                                    <th>Montant</th>
                                    <td id="donAmount">100 Dt</td>
                                </tr>
                                <tr>
                                    <th>Description</th>
                                    <td id="donDescription">Don pour l'achat de matériel médical</td>
                                </tr>
                                <tr>
                                    <th>Date du Don</th>
                                    <td id="donDate">12 Janvier 2025</td>
                                </tr>
                                <tr>
                                    <th>Email</th>
                                    <td id="donEmail">utilisateur@example.com</td>
                                </tr>
                                <tr>
                                    <th>Téléphone</th>
                                    <td id="donPhone">+123 456 7890</td>
                                </tr>
                            </table>
                        </div>
    
                        <!-- Bouton Générer PDF -->
                        <button id="generatePDF" class="btn btn-success btn-lg btn-block">Générer le PDF</button>
    
                        <a href="Historique_mes_don.html" class="btn btn-primary btn-lg btn-block">Retour à l'historique des dons</a>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Footer -->
        <footer>
            <div class="container text-center">
                <p>&copy; 2025 Clinicom. Tous droits réservés.</p>
            </div>
        </footer>
    
        <!-- Scripts -->
        <script src="assets/js/jquery-1.12.4.min.js"></script>
        <script src="assets/js/bootstrap.min.js"></script>
    
        <!-- jsPDF Library -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
        <script>
            // Récupérer les informations du don
            function generatePDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
    
                // Récupérer les informations du don
                const donID = document.getElementById("donID").textContent;
                const donType = document.getElementById("donType").textContent;
                const donAmount = document.getElementById("donAmount").textContent;
                const donDescription = document.getElementById("donDescription").textContent;
                const donDate = document.getElementById("donDate").textContent;
                const donEmail = document.getElementById("donEmail").textContent;
                const donPhone = document.getElementById("donPhone").textContent;
    
                // Créer le contenu du PDF
                doc.text("Détails du Don", 20, 20);
                doc.text("ID du Don: " + donID, 20, 30);
                doc.text("Type de Don: " + donType, 20, 40);
                doc.text("Montant: " + donAmount, 20, 50);
                doc.text("Description: " + donDescription, 20, 60);
                doc.text("Date du Don: " + donDate, 20, 70);
                doc.text("Email: " + donEmail, 20, 80);
                doc.text("Téléphone: " + donPhone, 20, 90);
    
                // Télécharger le PDF
                doc.save('don_details.pdf');
            }
    
            // Événement pour générer le PDF lors du clic sur le bouton
            document.getElementById("generatePDF").addEventListener("click", generatePDF);
        </script>

  

    <script src="assets/js/jquery-1.12.4.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>

    <!-- Script pour récupérer l'ID du don et charger dynamiquement les détails -->
    <script>
        // Exemple de récupération des paramètres d'URL pour afficher les détails d'un don
        const urlParams = new URLSearchParams(window.location.search);
        const donID = urlParams.get('id');  // Récupérer l'ID du don passé dans l'URL

        // Ici, vous devrez utiliser l'ID du don pour charger les informations depuis la base de données
        if (donID) {
            // Exemple de données simulées, vous devrez les remplacer par les données dynamiques
            const donData = {
                id: donID,
                type: "Argent",
                amount: "100 Dt",
                description: "Don pour l'achat de matériel médical",
                date: "12 Janvier 2025",
                email: "utilisateur@example.com",
                phone: "+123 456 7890"
            };

            // Remplir les informations dans le tableau
            document.getElementById("donID").textContent = donData.id;
            document.getElementById("donType").textContent = donData.type;
            document.getElementById("donAmount").textContent = donData.amount;
            document.getElementById("donDescription").textContent = donData.description;
            document.getElementById("donDate").textContent = donData.date;
            document.getElementById("donEmail").textContent = donData.email;
            document.getElementById("donPhone").textContent = donData.phone;
        }
    </script>

</body>

</html>
